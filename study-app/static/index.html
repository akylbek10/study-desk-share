<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Study Desk</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='9' fill='%232445C8'/><path d='M9 22.5 20.5 11a2.1 2.1 0 0 1 3 3L12 25.5l-4 1z' fill='none' stroke='white' stroke-width='2.4' stroke-linejoin='round'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,650;12..96,750&family=Onest:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<link rel="stylesheet" href="app.css">
<script>
  // apply the saved palette and theme before first paint
  // default: Graphite, dark ("black")
  var p = "graphite", t = "dark";
  try { p = JSON.parse(localStorage.getItem("palette")) || p; t = JSON.parse(localStorage.getItem("theme")) || t; } catch (e) {}
  document.documentElement.dataset.palette = p;
  if (t !== "auto") document.documentElement.dataset.theme = t;
</script>
</head>
<body>
<div class="shell">
  <nav class="rail" aria-label="Main">
    <a class="brand" href="#/today"><span class="brand-mark" aria-hidden="true"></span>Study Desk</a>
    <div class="rail-group" id="nav-main"></div>
    <div class="rail-label" id="subjects-label">Subjects</div>
    <div class="rail-group" id="nav-subjects" aria-labelledby="subjects-label"></div>
    <div class="rail-fill"></div>
    <div class="rail-group" id="nav-bottom"></div>
  </nav>

  <div class="main-col">
    <header class="topbar">
      <div class="topbar-title" id="topbar-title"></div>
      <div class="topbar-actions">
      <button class="btn sync-btn" id="sync-btn" type="button" hidden></button>
      <button class="btn assistant-btn" id="open-assistant" aria-controls="assistant" aria-expanded="false">
        <span class="i" data-i="sparkles"></span><span>Assistant</span><kbd>/</kbd>
      </button>
      </div>
    </header>
    <main id="view" tabindex="-1"></main>
  </div>

  <aside class="assistant" id="assistant" aria-label="Study assistant" hidden>
    <div class="as-head">
      <div>
        <h2>Assistant</h2>
        <p>Knows your programme, exam dates and progress</p>
      </div>
      <div class="as-actions">
        <button class="icon-btn" id="as-clear" aria-label="Start a new conversation" title="New conversation"><span class="i" data-i="refresh"></span></button>
        <button class="icon-btn" id="as-close" aria-label="Close assistant" title="Close (Esc)"><span class="i" data-i="x"></span></button>
      </div>
    </div>
    <div class="as-context" id="as-context"></div>
    <div class="as-body" id="as-body"></div>
    <form class="composer" id="as-form">
      <textarea id="as-input" rows="1" placeholder="Ask about your plan, a topic or your progress" aria-label="Message the assistant"></textarea>
      <button class="icon-btn primary" id="as-send" aria-label="Send"><span class="i" data-i="send"></span></button>
    </form>
  </aside>
</div>

<nav class="tabbar" id="tabbar" aria-label="Main"></nav>
<div class="scrim" id="scrim" hidden></div>
<div id="tooltip" role="tooltip" hidden></div>
<div id="toast" role="status" aria-live="polite"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.8/purify.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="palettes.js"></script>
<script src="app.js"></script>
<script src="figure.js"></script>
<script src="learn.js"></script>
<script src="timetable.js"></script>
<script src="sync.js"></script>
<script src="files.js"></script>
<script src="gemini.js"></script>
<script src="program.js"></script>
<script src="progress.js"></script>
</body>
</html>
